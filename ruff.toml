target-version = "py312"
line-length = 110
exclude = [".venv", "data", "logs", "output"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "UP", "RUF", "ISC"]
ignore = [
    "B008",   # FastAPI uses Depends()/File() in argument defaults by design
    "RUF001", # Cyrillic characters in strings are intentional
    "RUF002",
    "RUF003",
]
